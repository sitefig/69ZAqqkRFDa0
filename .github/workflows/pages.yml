# Publishes dist/ to GitHub Pages on every push to main.
# Actions are pinned by major tag, not by commit SHA: the SHAs could not be verified offline. Pin them before going live.
# Cache-Control cannot be changed on GitHub Pages (fixed short max-age). Immutability comes from hashed file names,
# freshness from manifest.json. Pages sends access-control-allow-origin: *, which the app's fetch needs.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node tools/check.mjs
      - run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
